name: ORIGENS — validação da fauna 0.9.1
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  unit-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: origens-v091-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
