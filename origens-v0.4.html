<script>
"use strict";
const T=32,GEN=2,SK='origens_save_v1',IK='origens_idx_v2',WK='origens_w_',W0=960,H0=540,cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=i=>document.getElementById(i);ctx.imageSmoothingEnabled=false;
/* v0.2: gerador corrigido (Fisher-Yates, 12 tentativas, nunca inicia mundo inválido, mínimos de recursos proporcionais à área, reposição determinística),
   vários mundos salvos (índice + 1 chave por mundo, migração do save v1 sem apagá-lo), jangada reconhecendo água rasa do mar (mapa 'sea'). */
// ===== SeededRandom / NoiseGenerator =====
const hs=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const hx=(x,y,s)=>{let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(s|0,2147483647);h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296};
const sm=t=>t*t*(3-2*t);
const vn=(x,y,s)=>{const xi=Math.floor(x),yi=Math.floor(y),fx=sm(x-xi),fy=sm(y-yi),a=hx(xi,yi,s),b=hx(xi+1,yi,s),c=hx(xi,yi+1,s),d=hx(xi+1,yi+1,s);return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy};
const fbm=(x,y,s)=>vn(x,y,s)*.55+vn(x*2.1,y*2.1,s+1)*.3+vn(x*4.3,y*4.3,s+2)*.15;
// ===== Geração: ilhas, biomas, terreno, objetos, validação =====
// terrenos: 0 fundo,1 médio,2 raso/lago,3 praia,4 grama,5 grama úmida,6 solo rochoso,7 vulcânico,8 lava,9 grama do ar
// objetos: 1 árvore,2 pedra,3 cristal/minério,4 junco,5 concha
function* build(name,seed,N,att){
const S=hs(seed+'|'+att),R=mul(S),I=[],c=N/2,P=att?'['+(att+1)+'] ':'';
const nb=(i,f)=>{const x=i%N;if(x>0)f(i-1);if(x<N-1)f(i+1);if(i>=N)f(i-N);if(i<N*N-N)f(i+N)};
const add=(x,y,rx,ry,el,kind)=>I.push({x,y,rx,ry,a:R()*6.28,el,kind,s:S+I.length*977});
yield P+'Posicionando ilhas';
add(c+(R()-.5)*N*.06,c+(R()-.5)*N*.06,Math.max(12,N*(.075+R()*.01)),Math.max(10.5,N*(.065+R()*.01)),0,0);
const ord=[1,2,3,4],a0=R()*6.28;for(let i=3;i>0;i--){const j=(R()*(i+1))|0;[ord[i],ord[j]]=[ord[j],ord[i]]}
ord.forEach((e,i)=>{const a=a0+i*1.5708+(R()-.5)*.5,d=N*(.29+R()*.05);add(c+Math.cos(a)*d,c+Math.sin(a)*d,Math.max(9,N*(.07+R()*.03)),Math.max(8,N*(.06+R()*.03)),e,0)});
const ns=Math.round(N/64*(.8+R()*.7));
for(let n=0;n<ns;n++)for(let t=0;t<60;t++){const x=N*(.08+R()*.84),y=N*(.08+R()*.84),rr=N*(.025+R()*.03);if(I.every(o=>Math.hypot(o.x-x,o.y-y)>(Math.max(o.rx,o.ry)+rr)*1.45+6)){add(x,y,rr*(1+R()*.6),rr,0,1+(R()*3|0));break}}
yield P+'Gerando costas (ruído fractal)';
const h=new Float32Array(N*N),own=new Uint8Array(N*N);
I.forEach((o,k)=>{const m=Math.max(o.rx,o.ry)*1.5+2,ca=Math.cos(o.a),sa=Math.sin(o.a);for(let y=Math.max(0,(o.y-m)|0);y<Math.min(N,o.y+m);y++)for(let x=Math.max(0,(o.x-m)|0);x<Math.min(N,o.x+m);x++){const dx=x-o.x,dy=y-o.y,u=(dx*ca+dy*sa)/o.rx,v2=(-dx*sa+dy*ca)/o.ry;let v=1-Math.hypot(u,v2)+(fbm(x*.045,y*.045,o.s)-.5)*.9;const e=Math.min(x,y,N-1-x,N-1-y);if(e<8)v-=(8-e)*.15;const i=y*N+x;if(v>h[i]){h[i]=v;own[i]=k+1}}});
const ter=new Uint8Array(N*N);for(let i=0;i<N*N;i++)ter[i]=h[i]>.15?4:0;
const Q=new Int32Array(N*N),seen=new Uint8Array(N*N);
for(let s0=0;s0<N*N;s0++){if(seen[s0]||!ter[s0])continue;let qh=0,qt=0;Q[qt++]=s0;seen[s0]=1;while(qh<qt)nb(Q[qh++],j=>{if(!seen[j]&&ter[j]){seen[j]=1;Q[qt++]=j}});if(qt<14)for(let k=0;k<qt;k++){ter[Q[k]]=0;own[Q[k]]=0}}
yield P+'Calculando profundidade e praias';
const D=new Uint8Array(N*N);let qh=0,qt=0;
for(let i=0;i<N*N;i++)nb(i,j=>{if(!D[i]&&(ter[j]>0)!==(ter[i]>0)){D[i]=1;Q[qt++]=i}});
while(qh<qt){const i=Q[qh++];nb(i,j=>{if(!D[j]&&(ter[j]>0)==(ter[i]>0)){D[j]=Math.min(254,D[i]+1);Q[qt++]=j}})}
yield P+'Aplicando biomas e terrenos';
for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x,d=D[i]||99;if(!ter[i]){ter[i]=d<=2?2:d<=6?1:0;continue}
const o=I[own[i]-1],el=o.el,n=fbm(x*.07,y*.07,S+5),bw=1+((fbm(x*.15,y*.15,S+7)*4)|0)+(o.kind==3?2:0);let t=4;
if(d<=bw)t=3;else if(el==1){t=5;if(n>.66&&d>4)t=2}else if(el==2||o.kind==2)t=n>.5?6:4;else if(el==3){t=n<.35?6:7;if(d>5&&fbm(x*.11,y*.11,S+11)>.7)t=8}else if(el==4)t=9;
ter[i]=t}
const sea=new Uint8Array(N*N);{let a=0,b=0;Q[b++]=0;sea[0]=1;while(a<b)nb(Q[a++],j=>{if(!sea[j]&&ter[j]<3){sea[j]=1;Q[b++]=j}})}
yield P+'Plantando vegetação e recursos';
const ob=new Uint8Array(N*N);
for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x,t=ter[i];if(t<3||t==8)continue;const o=I[own[i]-1],el=o.el,d=D[i];
if(t==3){if(d>1&&hx(x,y,S+37)<.012)ob[i]=5;continue}
if(d<2||fbm(x*.05,y*.05,S+13)>.62)continue;
let td=[.34,.28,.05,.015,.05][el],rd=[.025,.05,.1,.07,.03][el];if(o.kind==1)td=.45;if(o.kind==2)rd=.12;
const f=fbm(x*.09,y*.09,S+17);
if(hx(x,y,S+19)<td*Math.max(0,(f-.3)*2.4)){if(!(x&&ob[i-1]==1)&&!(y&&ob[i-N]==1))ob[i]=1}
else if(hx(x,y,S+23)<rd)ob[i]=(el>1&&el<4&&hx(x,y,S+29)<.2)?3:2;
else if(el==1&&hx(x,y,S+31)<.07)ob[i]=4}
// spawn seguro na ilha inicial
let sp=null,bd=1e9;const s0=I[0];
for(let y=Math.max(1,(s0.y-30)|0);y<Math.min(N-1,s0.y+30);y++)for(let x=Math.max(1,(s0.x-30)|0);x<Math.min(N-1,s0.x+30);x++){const i=y*N+x;if(ter[i]==4&&D[i]>=3&&own[i]==1){const q=Math.hypot(x-s0.x,y-s0.y);if(q<bd){bd=q;sp={x,y}}}}
if(sp)for(let y=sp.y-7;y<=sp.y+7;y++)for(let x=sp.x-7;x<=sp.x+7;x++)if(Math.hypot(x-sp.x,y-sp.y)<4.5+hx(x,y,S+41)*1.5)ob[y*N+x]=0;
yield P+'Validando o mundo';
const fails=[];let tr=0,rk=0;const ar=new Int32Array(I.length+1);for(let i=0;i<N*N;i++)if(ter[i]>2)ar[own[i]]++;
if(ar[1]<150)fails.push('ilha inicial pequena');for(let e=1;e<5;e++)if(ar[e+1]<60)fails.push('região '+['','Água','Terra','Fogo','Ar'][I[e].el]+' pequena');
for(let k=0;k<3;k++)for(let x=0;x<N;x++)if(ter[k*N+x]>2||ter[(N-1-k)*N+x]>2||ter[x*N+k]>2||ter[x*N+N-1-k]>2){fails.push('ilha cortada pela borda');k=3;break}
if(!sp)fails.push('sem spawn');else{
const vis=new Uint8Array(N*N),wk=i=>ter[i]>2&&ter[i]!=8&&(ob[i]<1||ob[i]>3);let qh=0,qt=0;Q[qt++]=sp.y*N+sp.x;vis[Q[0]]=1;
while(qh<qt)nb(Q[qh++],j=>{if(!vis[j]&&wk(j)){vis[j]=1;Q[qt++]=j}});
const reach=qt;if(reach<100)fails.push('spawn preso');
const m=Math.max(s0.rx,s0.ry)*1.6+2,bx0=Math.max(1,(s0.x-m)|0),bx1=Math.min(N-2,(s0.x+m)|0),by0=Math.max(1,(s0.y-m)|0),by1=Math.min(N-2,(s0.y+m)|0);
const cnt=()=>{const q=[0,0,0,0];for(let y=by0;y<=by1;y++)for(let x=bx0;x<=bx1;x++){const i=y*N+x,o=ob[i];if(own[i]!=1||o<1||o>3)continue;let a=0;nb(i,j=>{if(vis[j])a=1});if(!a)continue;const n=Math.hypot(x-sp.x,y-sp.y)<=16;if(o==1){q[0]++;if(n)q[2]++}else{q[1]++;if(n)q[3]++}}return q};
const fill=(t,n,mr)=>{if(n<=0)return;const c=[];for(let y=by0;y<=by1;y++)for(let x=bx0;x<=bx1;x++){const i=y*N+x,d=Math.hypot(x-sp.x,y-sp.y);if(!vis[i]||ter[i]!=4||D[i]<3||ob[i]||d<=5.5||d>mr)continue;let k=1;for(let b=-1;b<=1;b++)for(let a=-1;a<=1;a++){const j=i+b*N+a;if(!vis[j]||(ob[j]>0&&ob[j]<4))k=0}if(k)c.push(i)}c.sort((p,q)=>hx(p%N,(p/N)|0,S+53)-hx(q%N,(q/N)|0,S+53));for(let k=0;k<n&&k<c.length;k++)ob[c[k]]=t};
const mt=Math.min(25,Math.max(6,reach>>5)),mrk=Math.min(15,Math.max(4,(reach/60)|0));
let r0=cnt();fill(1,mt-r0[0],1e9);fill(2,mrk-r0[1],1e9);r0=cnt();fill(1,3-r0[2],16);fill(2,2-r0[3],16);const r1=cnt();tr=r1[0];rk=r1[1];
if(tr<mt)fails.push('poucas árvores');if(rk<mrk)fails.push('poucas pedras');if(r1[2]<3||r1[3]<2)fails.push('recursos longe do spawn');
let cs=0;for(let k=0;k<reach&&!cs;k++){const i=Q[k];if(ter[i]==3)nb(i,j=>{if(sea[j])cs=1})}
if(!cs)fails.push('sem costa acessível');
for(let e=1;e<5;e++){let f=0;for(let i=0;i<N*N&&!f;i++)if(own[i]==e+1&&ter[i]>2)nb(i,j=>{if(sea[j])f=1});if(!f)fails.push('ilha '+e+' inacessível')}}

// ===== Inventário v0.4: modelo =====
const INVENTORY_SIZE = 16;
const DEFAULT_MAX_STACK = 200;
const HOTBAR_SIZE = 9;
const ITEM_TYPES = Object.freeze({
  wood: Object.freeze({
    id: 'wood',
    name: 'Madeira',
    maxStack: DEFAULT_MAX_STACK,
    category: 'material',
    color: '#b67b41',
  }),
  stone: Object.freeze({
    id: 'stone',
    name: 'Pedra',
    maxStack: DEFAULT_MAX_STACK,
    category: 'material',
    color: '#bcc5c9',
  }),
  ore: Object.freeze({
    id: 'ore',
    name: 'Minério bruto',
    maxStack: DEFAULT_MAX_STACK,
    category: 'material',
    color: '#a6f5ff',
  }),
});

function inventoryItem(itemId) {
  return typeof itemId === 'string' && Object.hasOwn(ITEM_TYPES, itemId)
    ? ITEM_TYPES[itemId]
    : null;
}

function createInventory() {
  return {
    slots: Array(INVENTORY_SIZE).fill(null),
    cursor: null,
    selected: 0,
    pending: { wood: 0, stone: 0, ore: 0 },
    migrationVersion: 1,
  };
}

function isValidStack(stack) {
  const item =
    stack && typeof stack === 'object' && !Array.isArray(stack)
      ? inventoryItem(stack.itemId)
      : null;
  return (
    !!item &&
    Number.isSafeInteger(stack.quantity) &&
    stack.quantity > 0 &&
    stack.quantity <= item.maxStack
  );
}

function inventoryReady(inv) {
  if (!inv || !Array.isArray(inv.slots) || inv.slots.length !== INVENTORY_SIZE) return false;
  const references = new Set();
  for (const stack of [...inv.slots, inv.cursor]) {
    if (stack === null) continue;
    if (!isValidStack(stack) || references.has(stack)) return false;
    references.add(stack);
  }
  return true;
}

function inventoryCapacity(inv, itemId) {
  const item = inventoryItem(itemId);
  if (!item || !inventoryReady(inv)) return 0;
  return inv.slots.reduce(
    (total, stack) =>
      total +
      (!stack ? item.maxStack : stack.itemId === itemId ? item.maxStack - stack.quantity : 0),
    0,
  );
}

function addItems(inv, itemId, quantity) {
  if (!Number.isSafeInteger(quantity) || quantity <= 0) return 0;
  const item = inventoryItem(itemId);
  if (!item || !inventoryReady(inv)) return quantity;
  let remainder = quantity;
  // Filling partial stacks first prevents needless fragmentation.
  for (const stack of inv.slots) {
    if (!stack || stack.itemId !== itemId) continue;
    const amount = Math.min(remainder, item.maxStack - stack.quantity);
    stack.quantity += amount;
    remainder -= amount;
    if (!remainder) return 0;
  }
  for (let i = 0; i < INVENTORY_SIZE && remainder; i++) {
    if (inv.slots[i] !== null) continue;
    const amount = Math.min(remainder, item.maxStack);
    inv.slots[i] = { itemId, quantity: amount };
    remainder -= amount;
  }
  return remainder;
}

function inventoryTotals(inv) {
  const totals = { wood: 0, stone: 0, ore: 0 };
  if (!inventoryReady(inv)) return totals;
  for (const stack of [...inv.slots, inv.cursor]) if (stack) totals[stack.itemId] += stack.quantity;
  return totals;
}

function inventorySlotClick(inv, index, button = 0) {
  if (
    !inventoryReady(inv) ||
    !Number.isInteger(index) ||
    index < 0 ||
    index >= INVENTORY_SIZE ||
    (button !== 0 && button !== 2)
  )
    return false;
  const slot = inv.slots[index],
    cursor = inv.cursor;
  if (!cursor) {
    if (!slot) return false;
    const amount = button === 2 ? Math.ceil(slot.quantity / 2) : slot.quantity;
    inv.cursor = { itemId: slot.itemId, quantity: amount };
    inv.slots[index] =
      slot.quantity === amount ? null : { itemId: slot.itemId, quantity: slot.quantity - amount };
    return true;
  }
  if (button === 0 && slot && slot.itemId !== cursor.itemId) {
    inv.slots[index] = { ...cursor };
    inv.cursor = { ...slot };
    return true;
  }
  if (slot && slot.itemId !== cursor.itemId) return false;
  const room = inventoryItem(cursor.itemId).maxStack - (slot ? slot.quantity : 0);
  const amount = Math.min(room, button === 2 ? 1 : cursor.quantity);
  if (!amount) return false;
  inv.slots[index] = {
    itemId: cursor.itemId,
    quantity: (slot ? slot.quantity : 0) + amount,
  };
  inv.cursor =
    cursor.quantity === amount
      ? null
      : { itemId: cursor.itemId, quantity: cursor.quantity - amount };
  return true;
}

function returnInventoryCursor(inv) {
  if (!inventoryReady(inv)) return false;
  if (!inv.cursor) return true;
  const { itemId, quantity } = inv.cursor;
  const remainder = addItems(inv, itemId, quantity);
  inv.cursor = remainder ? { itemId, quantity: remainder } : null;
  return remainder === 0;
}

function selectInventorySlot(inv, index) {
  if (
    !inventoryReady(inv) ||
    !Number.isInteger(index) ||
    index < 0 ||
    index >= HOTBAR_SIZE ||
    inv.selected === index
  )
    return false;
  inv.selected = index;
  return true;
}

function claimPendingInventory(inv) {
  if (!inventoryReady(inv) || !inv.pending || typeof inv.pending !== 'object') return 0;
  let inserted = 0;
  for (const itemId of Object.keys(ITEM_TYPES)) {
    const amount = inv.pending[itemId];
    if (!Number.isSafeInteger(amount) || amount <= 0) continue;
    const remainder = addItems(inv, itemId, amount);
    inserted += amount - remainder;
    inv.pending[itemId] = remainder;
  }
  return inserted;
}

function restoreInventory(data, legacyMaterials = null) {
  const inv = createInventory();
  if (data === null || data === undefined) {
    // This path is chosen by the save loader only for an old schema. New saves
    // restore their inventory directly and never add the old counters again.
    if (legacyMaterials && typeof legacyMaterials === 'object') {
      for (const itemId of Object.keys(ITEM_TYPES)) {
        const amount = legacyMaterials[itemId];
        if (Number.isSafeInteger(amount) && amount > 0)
          inv.pending[itemId] = addItems(inv, itemId, amount);
      }
    }
    return inv;
  }
  if (typeof data !== 'object' || Array.isArray(data)) return inv;
  if (Number.isInteger(data.selected) && data.selected >= 0 && data.selected < HOTBAR_SIZE)
    inv.selected = data.selected;
  if (data.pending && typeof data.pending === 'object') {
    for (const itemId of Object.keys(ITEM_TYPES)) {
      const amount = data.pending[itemId];
      if (Number.isSafeInteger(amount) && amount >= 0) inv.pending[itemId] = amount;
    }
  }
  const overflow = [];
  const readStack = (stack, allowSlot) => {
    if (
      !stack ||
      typeof stack !== 'object' ||
      Array.isArray(stack) ||
      !inventoryItem(stack.itemId) ||
      !Number.isSafeInteger(stack.quantity) ||
      stack.quantity <= 0
    )
      return null;
    const quantity = allowSlot ? Math.min(stack.quantity, inventoryItem(stack.itemId).maxStack) : 0;
    const excess = stack.quantity - quantity;
    if (excess) overflow.push({ itemId: stack.itemId, quantity: excess });
    return quantity ? { itemId: stack.itemId, quantity } : null;
  };
  // Restore every valid in-range position first so recovery cannot displace it.
  if (Array.isArray(data.slots)) {
    for (let i = 0; i < data.slots.length; i++) {
      const stack = readStack(data.slots[i], i < INVENTORY_SIZE);
      if (i < INVENTORY_SIZE) inv.slots[i] = stack;
    }
  }
  inv.cursor = readStack(data.cursor, true);
  // Excess from malformed overfull slots/cursor or extra saved positions is
  // recovered, not turned into additional storage slots. Keep visible escrow
  // if the sixteen regular slots cannot hold it.
  for (const stack of overflow) {
    const remainder = addItems(inv, stack.itemId, stack.quantity);
    if (Number.isSafeInteger(inv.pending[stack.itemId] + remainder))
      inv.pending[stack.itemId] += remainder;
    // An aggregate beyond MAX_SAFE_INTEGER is corrupt/unrepresentable data;
    // leave the prior valid escrow untouched rather than round its quantity.
  }
  return inv;
}

function serializeInventory(inv) {
  if (!inventoryReady(inv)) return serializeInventory(restoreInventory(inv));
  const pending = { wood: 0, stone: 0, ore: 0 };
  for (const itemId of Object.keys(ITEM_TYPES)) {
    const amount = inv.pending && inv.pending[itemId];
    if (Number.isSafeInteger(amount) && amount >= 0) pending[itemId] = amount;
  }
  return {
    slots: inv.slots.map((stack) => (stack ? { ...stack } : null)),
    cursor: inv.cursor ? { ...inv.cursor } : null,
    selected:
      Number.isInteger(inv.selected) && inv.selected >= 0 && inv.selected < HOTBAR_SIZE
        ? inv.selected
        : 0,
    pending,
    migrationVersion: 1,
  };
}
// ===== Fim do modelo de inventário =====

// ===== Inventário v0.4: interface =====
// ===== Interface de inventário v0.4 =====
let inventoryUIReady = false;
let inventoryUIWorld = null;
let inventoryUISelected = -1;
let inventoryUIQuickSelection = -1;
let inventoryUIHover = null;
const inventoryUIPointer = { x: 0, y: 0, known: false };

function inventoryUIActive() {
  return !!G && !busy && $('m').style.display === 'none';
}

function setInventoryStatus(message) {
  if (inventoryUIReady) $('inventory-status').textContent = message;
}

function inventorySlotDescription(index, stack, hotbar) {
  const prefix = hotbar ? 'Atalho ' + (index + 1) : 'Espaço ' + (index + 1);
  return prefix + (stack ? ': ' + ITEM_TYPES[stack.itemId].name + ', ' + stack.quantity + ' de ' + ITEM_TYPES[stack.itemId].maxStack : ': vazio');
}

function fillInventoryButton(button, stack, index, hotbar) {
  const icon = button.querySelector('.item-icon');
  const quantity = button.querySelector('.item-quantity');
  button.dataset.itemId = stack ? stack.itemId : '';
  button.dataset.quantity = stack ? String(stack.quantity) : '';
  button.classList.toggle('is-occupied', !!stack);
  button.classList.toggle('is-empty', !stack);
  const selected = hotbar ? G.inventory.selected === index : inventoryUISelected === index;
  button.classList.toggle('is-selected', selected);
  button.setAttribute('aria-pressed', String(selected));
  button.setAttribute('aria-label', inventorySlotDescription(index, stack, hotbar));
  icon.dataset.item = stack ? stack.itemId : '';
  icon.hidden = !stack;
  quantity.textContent = stack ? String(stack.quantity) : '';
  quantity.hidden = !stack;
}

function positionInventoryUI() {
  if (!inventoryUIReady) return;
  const canvasRect = cv.getBoundingClientRect();
  const wrapperRect = $('w').getBoundingClientRect();
  const hotbar = $('hotbar');
  const available = Math.max(180, canvasRect.width - 20);
  const scale = canvasRect.width / W0;
  const gap = Math.max(2, Math.min(4, Math.round(4 * scale)));
  const size = Math.max(18, Math.min(52, Math.max(24, Math.floor(48 * scale)), Math.floor((available - 14 - gap * 8) / HOTBAR_SIZE)));
  hotbar.style.left = canvasRect.left - wrapperRect.left + canvasRect.width / 2 + 'px';
  hotbar.style.top = canvasRect.bottom - wrapperRect.top - Math.max(6, 10 * scale) + 'px';
  hotbar.style.setProperty('--hotbar-slot', size + 'px');
  hotbar.style.setProperty('--hotbar-gap', gap + 'px');
  hotbar.style.setProperty('--hotbar-key', Math.max(8, Math.min(10, size / 4.4)) + 'px');
  hotbar.style.setProperty('--hotbar-quantity', Math.max(8, Math.min(13, size / 3.6)) + 'px');
  hotbar.style.setProperty('--hotbar-icon', String(Math.max(0.55, Math.min(1, size / 42))));
  positionInventoryFloating($('inventory-cursor'), 15, 16);
  refreshInventoryTooltip();
}

function positionInventoryFloating(element, offsetX, offsetY) {
  if (!inventoryUIReady || element.hidden) return;
  const bounds = element.getBoundingClientRect();
  const x = inventoryUIPointer.known ? inventoryUIPointer.x : innerWidth / 2;
  const y = inventoryUIPointer.known ? inventoryUIPointer.y : innerHeight / 2;
  element.style.left = Math.max(4, Math.min(innerWidth - bounds.width - 4, x + offsetX)) + 'px';
  element.style.top = Math.max(4, Math.min(innerHeight - bounds.height - 4, y + offsetY)) + 'px';
}

function refreshInventoryTooltip() {
  if (!inventoryUIReady) return;
  const tooltip = $('inventory-tooltip');
  if (!inventoryUIActive() || mapOpen || (inventoryUIHover && !inventoryOpen && inventoryUIHover.hasAttribute('data-slot'))) {
    inventoryUIHover = null;
    tooltip.hidden = true;
    return;
  }
  if (!inventoryUIHover || !inventoryUIHover.isConnected || G.inventory.cursor) {
    tooltip.hidden = true;
    return;
  }
  const hotbar = inventoryUIHover.hasAttribute('data-hotbar');
  const index = Number(inventoryUIHover.dataset[hotbar ? 'hotbar' : 'slot']);
  const stack = G.inventory.slots[index];
  tooltip.textContent = inventorySlotDescription(index, stack, hotbar);
  tooltip.hidden = false;
  positionInventoryFloating(tooltip, 14, 18);
}

function updateInventoryCursor(event) {
  if (!inventoryUIReady) return;
  if (event && Number.isFinite(event.clientX) && Number.isFinite(event.clientY)) {
    inventoryUIPointer.x = event.clientX;
    inventoryUIPointer.y = event.clientY;
    inventoryUIPointer.known = true;
  }
  const cursor = $('inventory-cursor');
  cursor.hidden = !inventoryUIActive() || !inventoryOpen || !G.inventory.cursor;
  if (!cursor.hidden) {
    cursor.querySelector('.item-icon').dataset.item = G.inventory.cursor.itemId;
    cursor.querySelector('.item-quantity').textContent = G.inventory.cursor.quantity;
    positionInventoryFloating(cursor, 15, 16);
  }
  refreshInventoryTooltip();
}

function renderInventoryUI() {
  if (!inventoryUIReady) return;
  const active = inventoryUIActive();
  const overlay = $('inventory-overlay');
  overlay.hidden = !active || !inventoryOpen;
  $('hotbar').hidden = !active || !!mapOpen;
  if (!active) {
    $('inventory-cursor').hidden = true;
    $('inventory-tooltip').hidden = true;
    return;
  }
  if (inventoryUIWorld !== G.id) {
    inventoryUIWorld = G.id;
    inventoryUISelected = G.inventory.selected;
    inventoryUIQuickSelection = G.inventory.selected;
    inventoryUIHover = null;
    setInventoryStatus(G.inventory.cursor ? 'Pilha pendente recuperada. Coloque-a na mochila para continuar.' : 'Organize os materiais com o mouse.');
  }
  if (inventoryUIQuickSelection !== G.inventory.selected) {
    inventoryUISelected = G.inventory.selected;
    inventoryUIQuickSelection = G.inventory.selected;
  }
  $('inventory-capacity').textContent = G.inventory.slots.filter(Boolean).length + '/' + INVENTORY_SIZE;
  for (const button of $('inventory-grid').children) {
    const index = Number(button.dataset.slot);
    fillInventoryButton(button, G.inventory.slots[index], index, false);
  }
  for (const button of $('hotbar').children) {
    const index = Number(button.dataset.hotbar);
    fillInventoryButton(button, G.inventory.slots[index], index, true);
  }
  const pending = Object.entries(G.inventory.pending || {}).filter(([, amount]) => amount > 0);
  $('inventory-pending').hidden = pending.length === 0;
  $('inventory-pending-text').textContent = pending.length ? 'Materiais preservados da migração: ' + pending.map(([id, amount]) => amount + ' ' + ITEM_TYPES[id].name).join(' · ') + '. Libere espaços e recolha-os.' : '';
  updateInventoryCursor();
  positionInventoryUI();
}

function clearInventoryUI() {
  if (!inventoryUIReady) return;
  inventoryUIWorld = null;
  inventoryUISelected = -1;
  inventoryUIQuickSelection = -1;
  inventoryUIHover = null;
  for (const id of ['inventory-overlay', 'hotbar', 'inventory-cursor', 'inventory-tooltip']) $(id).hidden = true;
}

function handleInventorySlot(event, index) {
  if ((event.button !== 0 && event.button !== 2) || !inventoryOpen || !sessionInputActive()) return;
  event.preventDefault();
  event.stopPropagation();
  updateInventoryCursor(event);
  const inventory = G.inventory;
  const held = inventory.cursor ? { ...inventory.cursor } : null;
  const target = inventory.slots[index] ? { ...inventory.slots[index] } : null;
  inventoryUISelected = index;
  if (!inventorySlotClick(inventory, index, event.button)) {
    renderInventoryUI();
    if (held && target && held.itemId !== target.itemId && event.button === 2) setInventoryStatus('Esse espaço contém outro material. Use o esquerdo para trocar.');
    else if (held && target && target.quantity >= ITEM_TYPES[target.itemId].maxStack) setInventoryStatus('Essa pilha já está completa. Escolha outro espaço.');
    else setInventoryStatus(held ? 'Não foi possível colocar a pilha nesse espaço.' : 'Espaço vazio.');
    return;
  }
  inventoryChanged();
  if (!held) setInventoryStatus(event.button === 2 ? 'Pilha dividida. Escolha onde colocar os itens do cursor.' : 'Pilha no cursor. Escolha outro espaço.');

  else if (target) setInventoryStatus(inventory.cursor ? 'Pilha completada; o excedente continua no cursor.' : 'Materiais agrupados.');

function makeInventoryButton(index, hotbar) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = hotbar ? 'hotbar-slot' : 'inv-slot' + (index < HOTBAR_SIZE ? ' is-quick' : '');
  button.dataset[hotbar ? 'hotbar' : 'slot'] = index;
  const key = document.createElement('span');
  key.className = 'slot-key';
  key.textContent = hotbar || index < HOTBAR_SIZE ? String(index + 1) : '·';
  const icon = document.createElement('span');
  icon.className = 'item-icon';
  icon.setAttribute('aria-hidden', 'true');
  const quantity = document.createElement('span');
  quantity.className = 'item-quantity';
  button.append(key, icon, quantity);
  button.addEventListener('mousedown', event => {
    if (hotbar) {
      event.preventDefault();
      event.stopPropagation();
      if (event.button !== 0 || !sessionInputActive() || mapOpen) return;
      if (selectInventorySlot(G.inventory, index)) inventoryChanged();
      else renderInventoryUI();
    } else handleInventorySlot(event, index);
  });
  // Keyboard activation has no mousedown; real mouse clicks are handled once above.
  button.addEventListener('click', event => {
    event.stopPropagation();
    if (event.detail !== 0) return;
    if (hotbar) {
      if (sessionInputActive() && !mapOpen && selectInventorySlot(G.inventory, index)) inventoryChanged();
    } else handleInventorySlot({ button: 0, preventDefault() {}, stopPropagation() {} }, index);
  });
  button.addEventListener('mouseenter', () => { inventoryUIHover = button; refreshInventoryTooltip(); });
  button.addEventListener('mouseleave', () => { if (inventoryUIHover === button) inventoryUIHover = null; refreshInventoryTooltip(); });
  button.addEventListener('focus', () => { inventoryUIHover = button; refreshInventoryTooltip(); });
  button.addEventListener('blur', () => { if (inventoryUIHover === button) inventoryUIHover = null; refreshInventoryTooltip(); });
  return button;
}

function initInventoryUI() {
  if (inventoryUIReady) return;
  inventoryUIReady = true;
  for (let i = 0; i < INVENTORY_SIZE; i++) $('inventory-grid').append(makeInventoryButton(i, false));
  for (let i = 0; i < HOTBAR_SIZE; i++) $('hotbar').append(makeInventoryButton(i, true));
  const stop = event => event.stopPropagation();
  for (const id of ['inventory-overlay', 'hotbar']) {
    for (const type of ['mousedown', 'mouseup', 'click', 'dblclick', 'wheel']) $(id).addEventListener(type, stop);
    $(id).addEventListener('contextmenu', event => { event.preventDefault(); event.stopPropagation(); });
  }
  $('inventory-close').addEventListener('click', () => {
    if (!setInventoryOpen(false)) setInventoryStatus('Não há espaço para devolver tudo. Organize a mochila; a pilha continua protegida no cursor.');
  });
  $('inventory-claim-pending').addEventListener('click', () => {
    if (!inventoryOpen || !sessionInputActive()) return;
    const inserted = claimPendingInventory(G.inventory);
    if (inserted > 0) { inventoryChanged(); setInventoryStatus(inserted + ' unidades pendentes guardadas na mochila.'); }
    else setInventoryStatus('Sem espaço compatível. Libere espaços antes de recolher os materiais pendentes.');
  });
  document.addEventListener('mousemove', updateInventoryCursor);
  addEventListener('resize', positionInventoryUI);
  addEventListener('blur', () => { inventoryUIHover = null; $('inventory-tooltip').hidden = true; });
  renderInventoryUI();
}

const RESOURCE_TYPES=Object.freeze({
  1:Object.freeze({hp:3,kind:'wood',amount:3,label:'madeira'}),
  2:Object.freeze({hp:4,kind:'stone',amount:2,label:'pedra'}),
  3:Object.freeze({hp:5,kind:'ore',amount:1,label:'minério'})

function createCollection(){return{removed:new Set(),damage:new Map(),drops:new Map(),materials:{wood:0,stone:0,ore:0},lastHitAt:-Infinity,lastWarningAt:-Infinity,feedback:null,dirty:false}}
function resourceBase(w,index){return{x:(index%w.N+.5)*T,y:Math.floor(index/w.N)*T+26}}
function restoreCollection(w,data){
  const c=createCollection();
  if(!data||typeof data!=='object')return c;
  const validIndex=i=>Number.isInteger(i)&&i>=0&&i<w.N*w.N;
  // Keep original types only for modified nodes; never copy the whole object map.
  const removedTypes=new Map();
  if(Array.isArray(data.removed))for(const i of data.removed){
    if(!validIndex(i)||!RESOURCE_TYPES[w.ob[i]]||w.ter[i]<3||w.ter[i]===8)continue;
    c.removed.add(i);removedTypes.set(i,w.ob[i]);
  }
  for(const i of c.removed)w.ob[i]=0;
  if(Array.isArray(data.damage))for(const entry of data.damage){
    if(!Array.isArray(entry)||entry.length!==2)continue;
    const [i,d]=entry,def=validIndex(i)?RESOURCE_TYPES[w.ob[i]]:null;
    if(def&&!c.removed.has(i)&&Number.isInteger(d)&&d>0&&d<def.hp)c.damage.set(i,d);
  }
  if(data.materials&&typeof data.materials==='object')for(const kind of Object.keys(c.materials)){
    const amount=data.materials[kind];
    if(Number.isSafeInteger(amount)&&amount>=0)c.materials[kind]=amount;
  }
  if(Array.isArray(data.drops))for(const d of data.drops){
    if(!d||typeof d!=='object'||typeof d.id!=='string'||!/^drop-\d+$/.test(d.id))continue;
    const i=Number(d.id.slice(5)),def=RESOURCE_TYPES[removedTypes.get(i)];
    if(!def||d.id!=='drop-'+i||c.drops.has(d.id)||d.kind!==def.kind||(!Number.isSafeInteger(d.amount)||d.amount<=0||d.amount>def.amount))continue;
    if(!Number.isFinite(d.x)||!Number.isFinite(d.y)||d.x<0||d.y<0||d.x>=w.N*T||d.y>=w.N*T)continue;
    if(Math.floor(d.x/T)!==i%w.N||Math.floor(d.y/T)!==Math.floor(i/w.N)||blocked(w,d.x,d.y,0))continue;
    c.drops.set(d.id,{id:d.id,kind:d.kind,x:d.x,y:d.y,amount:d.amount});

}
function serializeCollection(c){return{removed:[...c.removed],damage:[...c.damage],drops:[...c.drops.values()].map(d=>({...d}))}}

function pickResource(wx,wy){

function resourcePathClear(index){

function hitResource(index,now=performance.now()){
  if(!worldInputActive()||mapOpen||G.boat)return false;
  const g=G,c=g.collection,w=g.w;
  if(!Number.isInteger(index)||index<0||index>=w.N*w.N||c.removed.has(index))return false;
  const def=RESOURCE_TYPES[w.ob[index]];if(!def)return false;

  if(Math.hypot(g.px-b.x,g.py-b.y)>COLLECTION_RULES.reach){collectionWarning('Aproxime-se para coletar',now);return false}
  if(!resourcePathClear(index)){collectionWarning('Caminho bloqueado: aproxime-se por terra',now);return false}

function collectDrops(){
  if(!worldInputActive()||mapOpen||G.boat)return;
  const g=G,c=g.collection,gained={wood:0,stone:0,ore:0};
  for(const [id,d] of c.drops){
    if(Math.hypot(g.px-d.x,g.py-d.y)>COLLECTION_RULES.pickup)continue;
    // A wall or shoreline must not allow pickup through a neighboring tile.
    const steps=Math.max(1,Math.ceil(Math.hypot(g.px-d.x,g.py-d.y)/4));let clear=true;
    for(let s=0;s<=steps;s++)if(blocked(g.w,g.px+(d.x-g.px)*s/steps,g.py+(d.y-g.py)*s/steps,0)){clear=false;break}

}

function menu(){inventoryOpen=false;keys={};clearInventoryUI();migrate();const l=$('wl');l.textContent='';idx().sort((a,b)=>b.played-a.played).forEach(m=>{const r=document.createElement('div'),i=document.createElement('div'),p=document.createElement('button'),x=document.createElement('button');r.className='r';i.textContent=m.name+' · '+m.seed+' · '+m.size+'² · '+new Date(m.played).toLocaleDateString();p.textContent='Jogar';p.onclick=()=>loadWorld(m.id);x.textContent='Excluir';let c=0;x.onclick=()=>{if(!c){c=1;x.textContent='Confirmar?';setTimeout(()=>{c=0;x.textContent='Excluir'},3000)}else{try{localStorage.removeItem(WK+m.id);localStorage.removeItem(WK+m.id+'_backup_v2');localStorage.removeItem(WK+m.id+'_backup_v3');putIdx(idx().filter(o=>o.id!=m.id))}catch(e){}menu()}};r.append(i,p,x);l.append(r)});$('m').style.display='flex';$('ms').textContent=''}
menu();
// ===== Colisão, jogador, câmera =====
function blocked(w,x,y,boat,ignoreIndex=-1){const N=w.N,l=x-6,r=x+6,t=y-8;for(let ty=Math.floor(t/T);ty<=Math.floor(y/T);ty++)for(let tx=Math.floor(l/T);tx<=Math.floor(r/T);tx++){if(tx<0||ty<0||tx>=N||ty>=N)return 1;const i=ty*N+tx,tt=w.ter[i];if(boat){if(tt>2)return 1;continue}if(tt<3||tt==8)return 1;const o=w.ob[i];if(o>0&&o<4&&i!==ignoreIndex){const bx=tx*T,by=ty*T,[a,c,d,e]=o==1?[11,12,21,26]:[3,6,29,30];if(r>bx+a&&l<bx+d&&y>by+c&&t<by+e)return 1}}return 0}
function toggleBoat(){const g=G,w=g.w,N=w.N,tx=Math.floor(g.px/T),ty=Math.floor(g.py/T);
let bd=1e9,bx=-1,by=-1;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const x=tx+dx,y=ty+dy;if(x<0||y<0||x>=N||y>=N)continue;const i=y*N+x,t=w.ter[i],cx=(x+.5)*T,cy=(y+.5)*T,dd=Math.hypot(cx-g.px,cy-g.py);
if(!g.boat&&t<3&&w.sea[i]&&!blocked(w,cx,cy,1)&&dd<bd){bd=dd;bx=cx;by=cy}
if(g.boat&&t>2&&t!=8&&(w.ob[i]<1||w.ob[i]>3)&&!blocked(w,cx,cy,0)&&dd<bd){bd=dd;bx=cx;by=cy}}
if(bx>=0){g.px=bx;g.py=by;g.boat^=1;toast(g.boat?'Jangada: E para desembarcar':'Desembarcou');return}
toast(g.boat?'Sem ponto seguro para desembarcar':'Chegue perto da costa para embarcar')}
function update(dt){const g=G,w=g.w;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(mapOpen||inventoryOpen)dx=dy=0;
const mv=dx||dy;if(mv){const l=Math.hypot(dx,dy);dx/=l;dy/=l;const sp=(g.boat?150:128)*dt;let n=g.px+dx*sp;if(!blocked(w,n,g.py,g.boat))g.px=n;n=g.py+dy*sp;if(!blocked(w,g.px,n,g.boat))g.py=n;g.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?3:2):(dy>0?0:1)}
g.mv=mv;g.an+=mv?dt:0;const tx=Math.floor(g.px/T),ty=Math.floor(g.py/T);if(tx!=g.tx||ty!=g.ty){g.tx=tx;g.ty=ty;reveal(tx,ty,10)}
if(!inventoryOpen){const z=ZS[zi],vw=W0/z,vh=H0/z,k=1-Math.exp(-8*dt),WW=w.N*T;g.cx+=(g.px-g.cx)*k;g.cy+=(g.py-24-g.cy)*k;g.cx=Math.max(vw/2,Math.min(WW-vw/2,g.cx));g.cy=Math.max(vh/2,Math.min(WW-vh/2,g.cy));}
if(g.dirty&&performance.now()-lastPut>200){g.mx.putImageData(g.img,0,0);g.dirty=0;lastPut=performance.now()}collectDrops();if(g.saveDueAt&&performance.now()>=g.saveDueAt){g.saveDueAt=0;if(!save(1))g.saveDueAt=performance.now()+10000}if(toastT>0)toastT-=dt}
function strip(x,y,d,c){ctx.fillStyle=c;for(let i=0;i<32;i+=4){const o=(i>>2&1)?2:3;if(d==0)ctx.fillRect(x+i,y,4,o);else if(d==1)ctx.fillRect(x+32-o,y+i,o,4);else if(d==2)ctx.fillRect(x+i,y+32-o,4,o);else ctx.fillRect(x,y+i,o,4)}}
function player(x,y){const g=G,s=Math.sin(g.an*12)*(g.mv?1:0),X=Math.round(x-10),Y=Math.round(y-28),d=g.dir;
if(g.boat){ctx.fillStyle='#6b4423';ctx.fillRect(X-6,y-12,32,18);ctx.fillStyle='#9c6a36';for(let i=0;i<4;i++)ctx.fillRect(X-6,y-12+i*5,32,4)}else{ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(X+2,y-3,16,5)}
const o=g.boat?-4:0;ctx.fillStyle='#34407a';ctx.fillRect(X+4,Y+20+o,5,8-(s>.3?2:0));ctx.fillRect(X+11,Y+20+o,5,8-(s<-.3?2:0));
ctx.fillStyle='#d9534f';ctx.fillRect(X+3,Y+11+o,14,10);ctx.fillStyle='#f0c8a0';ctx.fillRect(X+1,Y+12+o,3,8);ctx.fillRect(X+16,Y+12+o,3,8);ctx.fillRect(X+4,Y+1+o,12,11);
ctx.fillStyle='#5a3a22';ctx.fillRect(X+3,Y+o,14,d==1?10:5);ctx.fillStyle='#222';
if(d==0){ctx.fillRect(X+7,Y+7+o,2,2);ctx.fillRect(X+12,Y+7+o,2,2)}else if(d==2)ctx.fillRect(X+6,Y+7+o,2,2);else if(d==3)ctx.fillRect(X+13,Y+7+o,2,2)}
function draw(tm){const g=G,w=g.w,N=w.N,z=ZS[zi],vw=W0/z,vh=H0/z,ox=Math.round(g.cx-vw/2),oy=Math.round(g.cy-vh/2);
g.view={z,ox,oy};
ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W0,H0);ctx.setTransform(z,0,0,z,-ox*z,-oy*z);
const x0=Math.max(0,Math.floor(ox/T)-1),x1=Math.min(N-1,Math.ceil((ox+vw)/T)+1),y0=Math.max(0,Math.floor(oy/T)-1),y1=Math.min(N-1,Math.ceil((oy+vh)/T)+1),L=[0,0,0,1,2,2,3,3,2,2],gt=(x,y)=>x<0||y<0||x>=N||y>=N?0:w.ter[y*N+x],DX=[0,1,0,-1],DY=[-1,0,1,0];let nobj=0;
for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){const t=w.ter[ty*N+tx];let v=(hx(tx,ty,7)*4)|0;if(t==8)v=(v+(tm*2|0))&3;ctx.drawImage(A[t][v],tx*T,ty*T);
for(let d=0;d<4;d++){const u=gt(tx+DX[d],ty+DY[d]);if(t<3){if(u>2&&u!=8)strip(tx*T,ty*T,d,'rgba(255,255,255,'+(.5+.3*Math.sin(tm*2+tx+ty))+')');else if(u<3&&u>t)strip(tx*T,ty*T,d,TC[u][0])}else if(u==8&&t!=8)strip(tx*T,ty*T,d,'#2a1a14');else if(u>2&&u!=8&&L[u]<L[t])strip(tx*T,ty*T,d,TC[u][0])}
if(t<3&&hx(tx,ty,9)<.2&&Math.sin(tm*1.5+hx(tx,ty,3)*6.28)>.2){ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(tx*T+2+(hx(tx,ty,5)*18|0),ty*T+2+(hx(tx,ty,6)*24|0),8,2)}}
drawDrops(ox,oy,vw,vh);
const pr=Math.floor(g.py/T);
for(let ty=Math.max(0,y0-3);ty<=Math.min(N-1,y1+1);ty++){for(let tx=Math.max(0,x0-2);tx<=Math.min(N-1,x1+2);tx++){const i=ty*N+tx,o=w.ob[i];if(o){nobj++;const el=w.I[w.own[i]-1]?w.I[w.own[i]-1].el:0;
if(o==1)ctx.drawImage(TS[el][hx(tx,ty,11)<.5?0:1],tx*T-16,ty*T+T-96);else if(o==2)ctx.drawImage(RS[el],tx*T,ty*T);else if(o==3)ctx.drawImage(CS[el==3?1:0],tx*T,ty*T);else if(o==4)ctx.drawImage(RD,tx*T,ty*T);else ctx.drawImage(SH,tx*T,ty*T)}}
if(ty==pr)player(g.px,g.py)}
drawCollectionFeedback();
g.nobj=nobj;g.nch=((x1>>5)-(x0>>5)+1)*((y1>>5)-(y0>>5)+1);
// HUD
ctx.setTransform(1,0,0,1,0,0);ctx.font='bold 14px monospace';ctx.textBaseline='top';
const txt=(s,x,y,c)=>{ctx.fillStyle='#000';ctx.fillText(s,x+1,y+1);ctx.fillStyle=c||'#e8f4ef';ctx.fillText(s,x,y)},ti=g.ty*N+g.tx,ow=w.own[ti],bio=w.ter[ti]<3&&ow==0?'Oceano':w.ter[ti]<3?'Águas costeiras':(w.I[ow-1].el?EL[w.I[ow-1].el]:ow==1?'Ilha inicial':'Ilhote');
const materials=inventoryTotals(g.inventory);
txt('Madeira '+materials.wood+' · Pedra '+materials.stone+' · Minério '+materials.ore,10,32,'#ffe2a8');
txt('I inventário · 1–9 atalhos · Clique: coletar · E jangada · M mapa · +/- zoom · Esc menu',10,H0-86,'#bfe6dc');
txt(w.name+' · '+bio+(g.boat?' · jangada':''),10,10);
const mx=W0-138,my=10;ctx.fillStyle='#8fd3c7';ctx.fillRect(mx-3,my-3,134,134);ctx.fillStyle='#0b1219';ctx.fillRect(mx,my,128,128);ctx.drawImage(g.mc,g.tx-32,g.ty-32,64,64,mx,my,128,128);
if(((tm*2)|0)%2==0){ctx.fillStyle='#ff3b3b';ctx.fillRect(mx+62,my+62,5,5)}
if(!mapOpen)drawBtn();
if(toastT>0)txt(toastM,W0/2-ctx.measureText(toastM).width/2,60,'#ffe28a');
if(dbg){const l=['FPS '+fps.toFixed(0)+' ('+(1000/Math.max(fps,1)).toFixed(1)+'ms)','pos '+(g.px/T).toFixed(1)+','+(g.py/T).toFixed(1),'tile '+g.tx+','+g.ty+' ter '+w.ter[ti]+' chunk '+(g.tx>>5)+','+(g.ty>>5),'seed '+w.seed+' tentativa '+(w.att+1),'objetos '+nobj+' chunks vis '+g.nch,'geração '+w.tgen+'ms ilhas '+w.I.length,'válido '+w.ok+(w.ok?'':' '+w.fails)];l.forEach((s,i)=>txt(s,10,54+i*16,'#9cff9c'))}
if(mapOpen)drawMap(tm)}
function drawMap(tm){const g=G,N=g.w.N,s=(Math.min(W0-40,H0-90)/N)*g.mz,X=g.mpx+W0/2-N*s/2,Y=g.mpy+H0/2+16-N*s/2;ctx.fillStyle='rgba(8,14,20,.97)';ctx.fillRect(0,0,W0,H0);
ctx.save();ctx.beginPath();ctx.rect(10,50,W0-20,H0-90);ctx.clip();ctx.drawImage(g.mc,X,Y,N*s,N*s);if(((tm*2)|0)%2==0){ctx.fillStyle='#ff3b3b';ctx.fillRect(X+g.px/T*s-3,Y+g.py/T*s-3,7,7)}ctx.restore();
ctx.strokeStyle='#8fd3c7';ctx.lineWidth=2;ctx.strokeRect(10,50,W0-20,H0-90);ctx.font='bold 14px monospace';ctx.fillStyle='#8fd3c7';ctx.fillText(g.w.name+'  ·  seed: '+g.w.seed+'  ·  '+N+'×'+N+'  ·  você: '+g.tx+','+g.ty,14,16);
ctx.fillStyle='#bfe6dc';ctx.fillText('Arraste: mover · Roda ou +/-: zoom · M/Esc: fechar',14,H0-28);
['#44b5c9 água','#e6d49a praia','#5aa13f grama','#8a8478 rocha','#4a3f3f vulcão','#e8531c lava'].forEach((l,i)=>{ctx.fillStyle=l.slice(0,7);ctx.fillRect(430+i*88,H0-27,10,10);ctx.fillStyle='#bfe6dc';ctx.font='12px monospace';ctx.fillText(l.slice(8),444+i*88,H0-28)});drawBtn()}
// ===== Entrada e loop =====
addEventListener('keydown',e=>{
if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)||e.target.isContentEditable)return;
const k=e.key.toLowerCase();if(!sessionInputActive()||e.repeat)return;
if(k==='i'){e.preventDefault();setInventoryOpen(!inventoryOpen);return}
if(/^[1-9]$/.test(k)&&!mapOpen){if(selectInventorySlot(G.inventory,Number(k)-1))inventoryChanged();e.preventDefault();return}
if(inventoryOpen){if(k==='escape'){e.preventDefault();setInventoryOpen(false)}else if(['w','a','s','d','e','m','+','-','arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();return}
keys[k]=1;
if(k==='m'){mapOpen^=1;keys={};dr=0;renderInventoryUI()}
else if(k==='e'&&!mapOpen)toggleBoat();
else if(k==='f3'){e.preventDefault();dbg^=1}
else if(k==='+'||k==='='){mapOpen?G.mz=Math.min(8,G.mz*1.2):zi=Math.min(3,zi+1)}
else if(k==='-'){mapOpen?G.mz=Math.max(.5,G.mz/1.2):zi=Math.max(0,zi-1)}
else if(k==='escape'){if(mapOpen){mapOpen=0;keys={};dr=0;renderInventoryUI()}else if(save()){G=null;keys={};dr=0;menu()}}
if(['arrowup','arrowdown',' '].includes(k))e.preventDefault();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);addEventListener('blur',()=>keys={});
addEventListener('pagehide',()=>{keys={};save(1)});
document.addEventListener('visibilitychange',()=>{if(document.hidden){keys={};save(1)}});setInterval(()=>save(1),10000);
let dr=0;cv.onmousedown=e=>{
if(e.button!==0||!worldInputActive())return;
const {x,y}=canvasPoint(e),b=btn();
if(x<0||y<0||x>=W0||y>=H0)return;
if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){revealAll();dr=0;return}
if(mapOpen){dr=1;return}
dr=0;if(isHudPoint(x,y))return;
const p=screenToWorld(x,y);if(p)primaryAction(p);
};addEventListener('mouseup',()=>dr=0);
cv.oncontextmenu=e=>e.preventDefault();
cv.onmousemove=e=>{if(dr&&worldInputActive()&&mapOpen){const r=cv.getBoundingClientRect();G.mpx+=e.movementX*W0/r.width;G.mpy+=e.movementY*H0/r.height}};
cv.onwheel=e=>{if(G&&mapOpen){e.preventDefault();G.mz=Math.max(.5,Math.min(8,G.mz*(e.deltaY<0?1.2:1/1.2)))}};
let last=0;function frame(ts){requestAnimationFrame(frame);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(!G)return;fa+=dt;fc++;if(fa>.5){fps=fc/fa;fa=fc=0}update(dt);draw(ts/1000)}
initInventoryUI();
requestAnimationFrame(frame);
